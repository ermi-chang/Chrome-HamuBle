<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HamuBle</title>
  <link rel="icon" href="iconm1.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg0: #171b21; --bg1: #1e242b; --bg2: #252c34; --bg3: #2d353e;
      /* 対話フィードバックは面のトークンと同色相に保つ（旧 #302F40 は紫方向へ外れていた） */
      --hov: #2b333c; --act: #343d47;
      --bdr: #333b44; --bdr2: #454f5a;
      --tx0: #e7eaee; --tx1: #a4aeb9; --tx2: #727d89;
      --acc: #57cfdc; --acc-d: #3fa8b5;
      /* --red は破壊的操作専用。警告は --org、無効表現は面と点線で行う */
      --grn: #3eb503; --org: #ffa826; --red: #ff4d00;
      --red-tx: #ff8f6a;
      --hp-g: #3eb503; --hp-o: #ffa826; --hp-r: #ff6a33;
      --bp-dot: #4fa3e0;
      --cat-free:  #a3d900;
      --cat-nm:    #8b1a2b;
      --cat-hl:    #5e4b9e;
      --cat-ul:    #c8137d;
      --cat-event: #f4c430;
      --cat-pro:   #c8a8e0;
      --cat-etc:   #7a8593;
      --r: 12px;
      --r-sm: 8px;
      --r-pill: 14px;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: row;
      background: var(--bg0); color: var(--tx0);
      /* 配信先（Windows / macOS）と出荷言語（簡体中文）から選定。旧指定は Windows に 1 書体も存在しなかった */
      font-family: system-ui, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei",
                   "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    /* 更新され続ける数値は等幅数字にして桁の揺れを止める */
    .tabnum { font-variant-numeric: tabular-nums; }

    /* ── Focus ── キーボード操作の可視化（全要素共通） */
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    input:focus-visible, select:focus-visible, .filter-check:focus-visible { outline-offset: 1px; }

    /* ── Icon bar ── */
    .icon-bar {
      width: 40px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 4px;
      background: var(--bg2); border-right: 1px solid var(--bdr);
      order: 0;
    }
    body.icon-bar-right .icon-bar { order: 2; border-left: 1px solid var(--bdr); border-right: none; }
    body.icon-bar-right .fav-bar  { order: 0; border-right: 1px solid var(--bdr); border-left: none; }
    .icon-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-sm); border: 1px solid transparent;
      cursor: pointer; background: none; padding: 0;
      color: var(--tx2); transition: background .15s ease-out, color .15s ease-out, border-color .15s ease-out;
    }
    .icon-btn:hover { background: var(--bg3); color: var(--tx1); }
    .icon-btn.active { background: rgba(87,207,220,0.12); border-color: var(--acc); color: var(--acc); }
    .icon-btn.saved { background: rgba(62,181,3,0.12); border-color: var(--grn); color: var(--grn); }
    .icon-btn.warn  { background: rgba(255,77,0,0.12);  border-color: var(--red); color: var(--red); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Fav bar ── */
    .fav-bar {
      width: 28px; flex-shrink: 0;
      align-self: stretch;
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 0;
      background: var(--bg1); border-left: 1px solid var(--bdr);
      order: 2;
    }
    .fav-slots {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      overflow: visible;
    }
    .fav-divider {
      width: 16px; height: 1px;
      background: var(--bdr);
      flex-shrink: 0;
    }
    .home-btn {
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; border: 1px solid var(--bdr2);
      cursor: pointer; background: none; padding: 0;
      color: var(--tx2); transition: background .15s ease-out, color .15s ease-out, border-color .15s ease-out;
      margin-top: auto; flex-shrink: 0;
    }
    .home-btn:hover { background: var(--bg2); color: var(--tx1); }
    .home-btn.saved { background: rgba(62,181,3,0.12); border-color: var(--grn); color: var(--grn); }
    .home-btn.warn  { background: rgba(255,77,0,0.12);  border-color: var(--red); color: var(--red); }
    .home-btn svg {
      width: 14px; height: 14px;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .fav-slot {
      position: relative;
      width: 22px; height: 22px;
      flex-shrink: 0;
    }
    .fav-btn {
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; border: 1px solid var(--bdr2);
      cursor: pointer; background: none; padding: 0;
      color: var(--tx2); font-size: 11px; font-weight: 700;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .fav-btn:hover { background: var(--bg2); color: var(--tx1); }
    .fav-btn.filled { color: var(--acc); border-color: var(--acc); }
    .fav-remove {
      position: absolute; top: -4px;
      left: -4px; right: auto;
      width: 12px; height: 12px; border-radius: 50%;
      background: #c0392b; color: #fff;
      font-size: 10px; line-height: 12px; text-align: center;
      border: none; cursor: pointer; padding: 0;
      display: none; z-index: 22;
    }
    body.icon-bar-right .fav-remove {
      left: auto; right: -4px;
    }
    .fav-slot:hover .fav-remove.visible,
    .fav-slot.renaming .fav-remove.visible { display: block; }

    /* ── Fav label (hover-expand to show name) ── */
    /* default: fav-bar は右側 → ラベルは左方向（main-content 側）へ展開 */
    .fav-label {
      position: absolute; top: 0;
      right: 22px; left: auto;
      height: 22px;
      width: 0; overflow: hidden;
      display: flex; align-items: center; gap: 4px;
      padding: 0;
      background: var(--bg1); border: 1px solid var(--bdr2);
      border-right: none; border-radius: 4px 0 0 4px;
      font-size: 11px; color: var(--tx0);
      opacity: 0; pointer-events: none;
      transition: width 150ms ease, opacity 100ms ease, padding 150ms ease;
      white-space: nowrap;
      z-index: 20;
    }
    .fav-slot:hover .fav-label,
    .fav-slot.renaming .fav-label {
      width: 120px; opacity: 1; padding: 0 6px;
      pointer-events: auto;
    }
    .fav-label-text {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis;
    }
    .fav-label-text.empty { color: var(--tx2); font-style: italic; }
    .fav-edit {
      flex: 0 0 auto;
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; padding: 0;
      color: var(--tx2); font-size: 11px; cursor: pointer;
      border-radius: 3px;
    }
    .fav-edit:hover { color: var(--acc); background: var(--bg2); }
    .fav-rename-input {
      flex: 1; min-width: 0;
      background: var(--bg2); border: 1px solid var(--acc);
      color: var(--tx0); border-radius: 3px;
      padding: 1px 4px; font-size: 11px;
      outline: none;
    }
    /* icon-bar-right 時は fav-bar が左側 → ラベルは右方向（main-content 側）へ展開 */
    body.icon-bar-right .fav-label {
      left: 22px; right: auto;
      border-left: none; border-right: 1px solid var(--bdr2);
      border-radius: 0 4px 4px 0;
    }
    /* ── Drag & drop states ── */
    .fav-slot.dragging .fav-btn { opacity: 0.35; }
    .fav-slot.drop-target .fav-btn {
      outline: 2px dashed var(--acc);
      outline-offset: 1px;
    }
    .fav-ghost {
      position: fixed; pointer-events: none; z-index: 9999;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; border: 1px solid var(--acc);
      background: var(--bg2); color: var(--acc);
      font-size: 11px; font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* ── Main content ── */
    .main-content {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      order: 1;
    }

    /* ── Tab-based visibility ── */
    body:not(.tab-rescue)       .rescue-only    { display: none !important; }
    body:not(.tab-host-history) .host-only      { display: none !important; }
    body:not(.tab-info)         .info-only      { display: none !important; }
    body:not(.tab-dashboard)    .dashboard-only { display: none !important; }
    body.tab-info      .list { display: none !important; }
    body.tab-dashboard .list { display: none !important; }

    /* ── Dashboard ── */
    .dashboard {
      flex: 1; min-width: 0;
      overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: 8px;
      padding: 8px 6px 12px;
    }
    .dash-section {
      border: 1px solid var(--bdr);
      border-radius: var(--r-sm);
      background: var(--bg1);
      padding: 8px;
    }
    .dash-section-title {
      font-size: 11px; font-weight: 700; color: var(--acc);
      letter-spacing: .04em; margin-bottom: 6px;
    }
    /* イベント告知セクションは .active-events 自身が枠を持つので二重枠にしない */
    .dash-section-events { border: none; background: none; padding: 0; }
    .dash-section-events .active-events { margin: 0; }
    /* 今日の自発サマリー */
    .dash-sum-total { font-size: 12px; color: var(--tx0); margin-bottom: 6px; }
    .dash-sum-total-n { font-size: 16px; font-weight: 700; color: var(--acc); margin: 0 2px; }
    .dash-sum-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .dash-sum-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 10px;
      background: var(--bg2); border: 1px solid var(--bdr);
      font-size: 11px;
    }
    .dash-sum-cat { color: var(--tx1); }
    .dash-sum-n { font-weight: 700; color: var(--tx0); }
    .dash-sum-empty { font-size: 11px; color: var(--tx2); }
    /* ドロップカレンダー（月単位、月曜始まり、土日強調、左右ナビ） */
    .dash-drop-cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    .dash-drop-cal-prev, .dash-drop-cal-next {
      background: var(--bg2); border: 1px solid var(--bdr); color: var(--tx1);
      border-radius: 4px; padding: 1px 8px; font-size: 12px; cursor: pointer;
    }
    .dash-drop-cal-prev:hover, .dash-drop-cal-next:hover:not([disabled]) {
      background: var(--bg1); color: var(--tx0);
    }
    .dash-drop-cal-next[disabled] { opacity: 0.4; cursor: not-allowed; }
    .dash-drop-cal-month { color: var(--tx0); font-weight: 700; font-size: 12px; }
    .dash-drop-cal-mid { display: inline-flex; align-items: center; gap: 6px; }
    .dash-drop-cal-shot {
      background: var(--bg2); border: 1px solid var(--bdr); color: var(--tx1);
      border-radius: 4px; padding: 1px 6px; font-size: 11px; cursor: pointer;
    }
    .dash-drop-cal-shot:hover:not([disabled]) { background: var(--bg1); color: var(--tx0); }
    .dash-drop-cal-shot[disabled] { opacity: 0.4; cursor: default; }

    .dash-drop-cal-head {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px; margin-bottom: 2px;
    }
    .dash-drop-cal-head > div {
      text-align: center; font-size: 10px; color: var(--tx2); padding: 1px 0;
    }
    .dash-drop-cal-head .sat { color: #8aa8d8; }
    .dash-drop-cal-head .sun { color: #d88a8a; }

    .dash-drop-cal {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .dash-drop-cell {
      position: relative; min-height: 34px;
      padding: 1px 2px;
      background: var(--bg2); border-radius: 3px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .dash-drop-cell.sat   { background: rgba(110, 140, 190, 0.15); }
    .dash-drop-cell.sun   { background: rgba(190, 110, 110, 0.15); }
    .dash-drop-cell.off   { opacity: 0.45; }
    .dash-drop-cell.today { outline: 1px solid var(--acc); }
    .dash-drop-cell-date  { color: var(--tx2); font-size: 10px; line-height: 1; }
    .dash-drop-cell-items { display: flex; flex-wrap: wrap; gap: 1px 2px; margin-top: 1px; }
    .dash-drop-cell-item  { display: inline-flex; align-items: center; gap: 1px; }
    .dash-drop-cell-item img {
      width: 21px; height: 21px; border-radius: 2px;
      object-fit: cover; background: var(--bg1);
    }
    .dash-drop-cell-item-count {
      font-size: 10px; color: var(--acc); font-weight: 700; line-height: 1;
    }
    .dash-drop-empty { font-size: 11px; color: var(--tx2); }

    /* 設定: ドロップウォッチ（アイコンチップ式） */
    .setting-block { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; border-top: 1px solid var(--bdr); }
    .setting-block-head { display: flex; justify-content: space-between; align-items: center; }
    .btn-drop-reset {
      background: var(--bg2); border: 1px solid var(--bdr); color: var(--tx1);
      border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
    }
    .btn-drop-reset:hover { background: var(--bg1); color: var(--tx0); }
    .drop-watch-chips {
      display: flex; flex-wrap: wrap; gap: 5px;
      align-items: center;
    }
    .drop-chip {
      width: 48px; height: 48px;
      padding: 0; border: 1px solid var(--bdr); border-radius: 6px;
      background: var(--bg2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .drop-chip:hover { border-color: var(--red); }
    .drop-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .drop-watch-input {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      padding: 4px;
      background: var(--bg0);
      border: 1px solid var(--bdr); border-radius: 4px;
    }
    .drop-watch-input input[type="text"] {
      flex: 1; min-width: 0;
      background: var(--bg2); color: var(--tx0);
      border: 1px solid var(--bdr); border-radius: 3px;
      font-size: 11px; padding: 3px 6px;
    }
    .drop-watch-input button {
      background: var(--bg2); border: 1px solid var(--bdr); color: var(--tx1);
      border-radius: 3px; padding: 2px 10px; font-size: 11px; cursor: pointer;
    }
    .drop-watch-input button:hover { background: var(--bg1); color: var(--tx0); }
    .drop-watch-input-error {
      flex-basis: 100%;
      font-size: 10px; color: var(--red);
    }
    .drop-watch-input-error:empty { display: none; }

    /* 最近観測ドロップ フッター（全タブ共通） */
    .recent-drops-footer {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px;
      border-top: 1px solid var(--bdr);
      background: var(--bg1);
      min-height: 54px;
    }
    .recent-drops-label {
      flex-shrink: 0;
      font-size: 10px; font-weight: 700; color: var(--tx2);
      letter-spacing: .04em;
    }
    .recent-drops-chips {
      flex: 1; min-width: 0;
      display: flex; gap: 5px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin;
    }
    .recent-drops-chips::-webkit-scrollbar { height: 4px; }
    .recent-drops-chips::-webkit-scrollbar-thumb { background: var(--bg2); border-radius: 2px; }
    .recent-drop-chip {
      position: relative;
      flex: 0 0 auto;
      width: 42px; height: 42px;
      padding: 0; border: 1px solid var(--bdr); border-radius: 6px;
      background: var(--bg2);
      cursor: pointer;
      overflow: visible;
    }
    .recent-drop-chip:hover { border-color: var(--acc); }
    .recent-drop-chip.is-registered { cursor: default; opacity: .65; }
    .recent-drop-chip.is-registered:hover { border-color: var(--bdr); }
    .recent-drop-chip img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 3px; display: block;
    }
    .recent-drop-count {
      position: absolute;
      right: -4px; bottom: -4px;
      background: var(--bg0); color: var(--acc);
      font-size: 10px; font-weight: 700;
      padding: 0 4px; border-radius: 7px;
      border: 1px solid var(--bdr);
      line-height: 1.4;
    }
    .recent-drop-check {
      position: absolute;
      top: -5px; right: -5px;
      width: 14px; height: 14px;
      background: var(--grn, #6c6); color: var(--bg0);
      font-size: 10px; font-weight: 700;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .recent-drops-empty {
      font-size: 10px; color: var(--tx2);
      flex: 1;
    }
    .recent-drops-chips:empty + .recent-drops-empty { display: inline; }
    .recent-drops-chips:not(:empty) + .recent-drops-empty { display: none; }

    /* ── Rescue control zone ──
       旧: 見出し / クイック / フィルタ / テンプレ / FP / ソート の 6 本の帯。
       新: クイック + テンプレ列 + 条件ボタン の 1 ゾーンに集約し、
           HP / 人数 / FP は #cond-panel へ格納する（既定は閉）。
           ソートは results-bar 右端へ吸収。カード 1 枚目の到達位置を上げるのが目的。 */
    .ctl { padding: 8px 10px 7px; background: var(--bg1); flex-shrink: 0; }
    .ctl-quick { display: flex; gap: 6px; margin-bottom: 7px; }
    .ctl-row { display: flex; align-items: flex-start; gap: 6px; }

    .btn-assist {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(87,207,220,0.12); border: 1px solid var(--acc-d);
      color: var(--acc); border-radius: var(--r-sm);
      padding: 8px 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .12s ease-out;
      font-family: inherit;
    }
    .btn-assist:hover { background: rgba(87,207,220,0.22); }
    .btn-assist:active { transform: scale(.985); }
    .btn-assist svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* 条件ボタン: 現在の絞り込み条件をラベルに要約表示し、押すと #cond-panel を開閉 */
    .cond-btn {
      flex-shrink: 0; margin-left: auto;
      display: inline-flex; align-items: center; gap: 5px;
      min-height: 24px; padding: 3px 8px;
      background: none; border: 1px solid var(--bdr); border-radius: var(--r-sm);
      color: var(--tx1); font-size: 11px; font-family: inherit; cursor: pointer;
      transition: color .12s ease-out, border-color .12s ease-out, background .12s ease-out;
    }
    .cond-btn:hover { color: var(--tx0); border-color: var(--bdr2); }
    .cond-btn[aria-expanded="true"] { background: rgba(87,207,220,0.12); border-color: var(--acc); color: var(--acc); }
    .cond-btn.has-cond { border-color: var(--acc-d); color: var(--acc); }
    .cond-summary { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cond-caret { width: 11px; height: 11px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s ease-out; }
    .cond-btn[aria-expanded="true"] .cond-caret { transform: rotate(180deg); }

    /* ── BP display (results-bar 件数横) ── */
    .bp-display {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--tx1);
    }
    .bp-display-label { color: var(--tx2); }
    .bp-display-value { color: var(--acc); font-weight: 600; }
    .bp-display.shortage .bp-display-value { color: var(--red); }

    /* ── BP shortage warning banner ── */
    /* 警告であって破壊的操作ではないので --org（--red は削除系専用） */
    .bp-shortage-banner {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px;
      background: rgba(255,168,38,0.13);
      border-bottom: 1px solid var(--org);
      color: var(--org);
      font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }
    .bp-shortage-banner[hidden],
    .setting-row[hidden] { display: none; }

    /* ── New release notice banner ── */
    .update-banner {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px;
      background: rgba(87,207,220,0.14);
      border-bottom: 1px solid var(--acc);
      color: var(--acc);
      font-size: 12px; font-weight: 600;
      flex-shrink: 0;
      cursor: pointer; text-decoration: none;
    }
    .update-banner[hidden] { display: none; }
    .update-banner-text { flex: 1; }
    .update-banner-close {
      background: none; border: none; color: var(--tx2);
      cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px;
    }
    .update-banner-close:hover { color: var(--tx0); }

    /* ── List BP-locked state（パネル全体グレーアウト） ── */
    .list.bp-locked {
      pointer-events: none;
      opacity: 0.4;
      filter: grayscale(0.7);
    }

    /* ── Settings panel ── */
    .settings-panel { display: none; background: var(--bg0); border-bottom: 2px solid var(--acc); padding: 10px; flex-shrink: 0; }
    .settings-panel.open { display: block; }
    .settings-title { font-size: 11px; color: var(--acc); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .setting-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-lbl { font-size: 12px; color: var(--tx1); flex-shrink: 0; width: 70px; }
    .setting-row select { flex: 1; background: var(--bg2); border: 1px solid var(--bdr2); color: var(--tx0); border-radius: 4px; padding: 4px 6px; font-size: 12px; cursor: pointer; }
    .setting-row .pill-group { flex: 1; }
    .setting-row input[type="range"] { flex: 1; accent-color: var(--acc); cursor: pointer; }
    .setting-val { font-size: 12px; color: var(--acc); font-weight: 600; width: 32px; text-align: right; flex-shrink: 0; }

    /* ── Pill group (language picker etc.) ── */
    .pill-group { display: flex; gap: 4px; }
    .pill {
      background: var(--bg2); border: 1px solid var(--bdr2); color: var(--tx1);
      border-radius: var(--r-sm); padding: 3px 8px; font-size: 11px; cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
    }
    .pill:hover { border-color: var(--acc); color: var(--acc); }
    .pill.active { background: rgba(87,207,220,0.15); border-color: var(--acc); color: var(--acc); font-weight: 700; }

    /* ── Condition panel（HP / 人数 / FP）──
       開くとリストを下へ押し出す（重ねない）。一覧最上段のカードは
       最も価値の高いクリック対象なので、開いている間も覆ってはならない。
       開閉状態は settings.condOpen に保存する。 */
    .ctl-wrap { flex-shrink: 0; }
    .cond-panel {
      padding: 8px 10px 9px;
      background: var(--bg1); border-bottom: 2px solid var(--acc);
    }
    .cond-panel[hidden] { display: none; }
    .filter-grid { display: flex; flex-direction: column; gap: 7px; }
    .filter-block {
      background: var(--bg2); border: 1px solid var(--bdr); border-radius: var(--r);
      padding: 7px 8px; transition: border-color .15s;
      display: flex; align-items: center; gap: 6px;
      min-width: 0;
    }
    .filter-block.active-filter { border-color: var(--acc); }
    .filter-check { width: 15px; height: 15px; cursor: pointer; accent-color: var(--acc); flex-shrink: 0; }
    .filter-block-title { font-size: 12px; font-weight: 600; color: var(--tx0); cursor: pointer; flex-shrink: 0; min-width: 28px; }
    .filter-block.disabled .filter-block-title { color: var(--tx2); }
    .filter-block > input[type="range"] { flex: 1; min-width: 0; accent-color: var(--acc); cursor: pointer; height: 18px; padding: 0; margin: 0; }
    .filter-block > .filter-val-display { font-size: 11px; color: var(--acc); font-weight: 700; flex-shrink: 0; min-width: 36px; text-align: right; }
    .filter-mode-toggle { display: inline-flex; border: 1px solid var(--bdr2); border-radius: var(--r-sm); overflow: hidden; flex-shrink: 0; }
    .filter-mode-toggle .mode-btn {
      background: var(--bg3); color: var(--tx2); border: none;
      padding: 3px 8px; font-size: 11px; cursor: pointer;
      transition: background .12s, color .12s;
    }
    .filter-mode-toggle .mode-btn:hover:not([aria-pressed="true"]) { color: var(--acc); }
    .filter-mode-toggle .mode-btn[aria-pressed="true"] { background: var(--acc); color: var(--bg0); font-weight: 700; }
    .filter-mode-toggle .mode-btn + .mode-btn { border-left: 1px solid var(--bdr2); }
    select:focus-visible, input[type="number"]:focus-visible { border-color: var(--acc); }
    .filter-block.disabled > :not(.filter-check):not(.filter-block-title) { opacity: 0.4; pointer-events: none; }

    /* ── Template chips（.ctl-row 内・1 タップで条件切替する最速動線なので常時表示） ── */
    .template-scroll {
      display: flex; align-items: center; gap: 5px;
      flex: 1; min-width: 0;
      flex-wrap: wrap;      /* ← 折り返し */
    }
    .tpl-chip { display: flex; align-items: center; background: var(--bg2); border: 1px solid var(--bdr); border-radius: var(--r-pill); flex-shrink: 0; overflow: hidden; transition: border-color .12s ease-out; }
    .tpl-chip:hover { border-color: var(--bdr2); }
    .tpl-chip.active-tpl { border-color: var(--acc); background: rgba(87,207,220,0.1); }
    .tpl-chip-name { padding: 4px 7px 4px 10px; font-size: 11px; color: var(--tx0); white-space: nowrap; background: none; border: none; font-family: inherit; cursor: pointer; }
    .tpl-chip.active-tpl .tpl-chip-name { color: var(--acc); font-weight: 600; }
    .tpl-chip-del { padding: 4px 8px 4px 3px; font-size: 10px; color: var(--tx2); cursor: pointer; line-height: 1; background: none; border: none; font-family: inherit; }
    .tpl-chip-del:hover { color: var(--red); }
    .btn-tpl-add { background: none; border: 1px dashed var(--bdr2); color: var(--tx2); border-radius: var(--r-pill); min-height: 24px; padding: 3px 10px; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: inherit; transition: border-color .12s ease-out, color .12s ease-out; }
    .btn-tpl-add:hover { border-color: var(--acc); color: var(--acc); }

    /* ── Results bar（件数 / BP / 更新時刻 / ソート） ── */
    .results-bar { display: flex; align-items: center; gap: 7px; padding: 5px 10px 4px; background: var(--bg0); flex-shrink: 0; }
    .count { font-size: 11px; color: var(--tx2); font-variant-numeric: tabular-nums; }
    .count span { color: var(--tx0); font-weight: 700; font-size: 13px; }
    .rb-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--bdr2); flex-shrink: 0; }
    .updated { font-size: 10px; color: var(--tx2); font-variant-numeric: tabular-nums; }
    .sort-mini {
      margin-left: auto; flex-shrink: 0;
      background: none; border: 1px solid transparent; border-radius: var(--r-sm);
      color: var(--tx2); font-size: 11px; font-family: inherit;
      padding: 2px 2px 2px 5px; cursor: pointer;
      transition: color .12s ease-out, border-color .12s ease-out;
    }
    .sort-mini:hover { color: var(--tx0); border-color: var(--bdr); }
    .sort-mini option { background: var(--bg2); color: var(--tx0); }

    /* ── Host history header ── */
    .host-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px;
      background: var(--bg2);
      flex-shrink: 0;
    }
    .host-header-title { font-size: 12px; font-weight: 600; color: var(--acc); }
    .host-header-date { font-size: 10px; color: var(--tx2); }
    /* ── Host tool bar ── */
    .host-tool-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      padding: 5px 10px;
      background: var(--bg2);
      flex-shrink: 0;
    }
    .host-tool-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: 1px solid var(--bdr2); border-radius: var(--r-pill);
      color: var(--tx2); font-size: 11px; line-height: 1; cursor: pointer;
      padding: 4px 9px; font-family: inherit; white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
    }
    .host-tool-btn .htb-ico { font-size: 12px; line-height: 1; }
    .host-tool-btn:hover { color: var(--tx1); border-color: var(--acc); }
    .host-tool-btn.active {
      color: var(--bg0); background: var(--acc); border-color: var(--acc); font-weight: 700;
    }
    /* 上限解除トグルの ON 色はタイル側の解除バッジと揃える */
    #btn-depleted-override.active {
      background: var(--cat-event); border-color: var(--cat-event);
    }

    /* ── Host category filter bar ── */
    .host-category-bar {
      display: flex; flex-wrap: wrap; gap: 4px;
      padding: 5px 8px;
      background: var(--bg1);
      flex-shrink: 0;
    }
    .cat-chip {
      position: relative;
      font-size: 11px; line-height: 1;
      padding: 4px 9px;
      background: var(--bg2);
      border: 1px solid var(--bdr2);
      color: var(--tx2);
      border-radius: var(--r-pill);
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background .12s, color .12s, border-color .12s, box-shadow .12s;
    }
    /* 全クエスト自発済み（クリア）: はなまるバッジ */
    .cat-chip.cleared::after {
      content: "";
      position: absolute;
      top: -5px; right: -5px;
      width: 14px; height: 14px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='10' r='8' fill='none' stroke='%23e53935' stroke-width='2.2'/><circle cx='10' cy='10' r='4.2' fill='none' stroke='%23e53935' stroke-width='1.6'/></svg>");
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,.6));
    }
    .cat-chip:hover { border-color: var(--cat-chip-color, var(--acc)); color: var(--tx1); }
    .cat-chip.active {
      background: var(--cat-chip-color, var(--acc));
      border-color: var(--cat-chip-color, var(--acc));
      color: var(--bg0);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--cat-chip-color, var(--acc));
    }
    .cat-chip[data-cat="all"]   { --cat-chip-color: var(--acc); }
    .cat-chip[data-cat="free"]  { --cat-chip-color: var(--cat-free); }
    .cat-chip[data-cat="nm"]    { --cat-chip-color: var(--cat-nm); }
    .cat-chip[data-cat="hl"]    { --cat-chip-color: var(--cat-hl); }
    .cat-chip[data-cat="ul"]    { --cat-chip-color: var(--cat-ul); }
    .cat-chip[data-cat="event"] { --cat-chip-color: var(--cat-event); }
    .cat-chip[data-cat="pro"]   { --cat-chip-color: var(--cat-pro); }
    .cat-chip[data-cat="etc"]   { --cat-chip-color: var(--cat-etc); }
    /* NM / HL は暗色なのでアクティブ時は白文字が読みやすい */
    .cat-chip[data-cat="nm"].active,
    .cat-chip[data-cat="hl"].active,
    .cat-chip[data-cat="ul"].active { color: #fff; }

    /* ── List ── */
    .list { overflow-y: auto; flex: 1; padding: 2px 8px 8px; }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: var(--bg0); }
    .list::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px; }

    /* ── Card ──
       3 ティア構成: HP%（主値） > レイド名（識別子） > 人数 / BP / 残り時間（メタ）。
       内側 3px / 外側 10px の余白比でカードを 1 個のオブジェクトとして読ませる（旧: 5px / 6px）。
       ゼブラ縞は廃止（parity で面が変わると joined / hover の判別が濁るため）。 */
    .card {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; margin-bottom: 10px;
      background: var(--bg1); border: 1px solid transparent; border-radius: var(--r);
      cursor: pointer; text-align: left; color: inherit; font-family: inherit;
      transition: background .1s ease-out; user-select: none;
    }
    .card:hover { background: var(--hov); }
    .card:active { background: var(--act); }
    .card.joining { opacity: .5; pointer-events: none; }
    .card.joined { background: rgba(62,181,3,0.10); border-color: rgba(62,181,3,.45); }
    /* 未対応レイド: 赤枠ではなく「面を持たない＋点線」で降格（--red は破壊的操作専用） */
    .card.card-unknown { background: none; border: 1px dashed var(--bdr); cursor: default; }
    .card.card-unknown .name { color: var(--tx1); }
    .card.card-unknown .hp-val, .card.card-unknown .mem { color: var(--tx2); }
    .thumb { width: 60px; height: 46px; border-radius: var(--r-sm); object-fit: cover; flex-shrink: 0; background: var(--bg2); pointer-events: none; }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
    .row1 { display: flex; align-items: baseline; gap: 8px; }
    .name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--tx0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { flex-shrink: 0; font-size: 11px; color: var(--tx2); font-variant-numeric: tabular-nums; }
    .row2 { display: flex; align-items: center; gap: 8px; }
    .hp-val { flex-shrink: 0; font-size: 18px; font-weight: 700; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .hp-val.g { color: var(--hp-g); } .hp-val.o { color: var(--hp-o); } .hp-val.r { color: var(--hp-r); }
    .hp-bar { flex: 1; min-width: 0; height: 3px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .hp-fill { display: block; height: 100%; border-radius: 3px; }
    .row3 { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--tx1); }
    .mem { font-weight: 600; font-variant-numeric: tabular-nums; }
    .mem i { font-style: normal; font-weight: 400; color: var(--tx2); }
    .bp-row { display: flex; align-items: center; gap: 3px; }
    .bp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bg3); }
    .bp-dot.on { background: var(--bp-dot); }
    .bp-half { font-size: 11px; color: var(--org); font-weight: 700; }
    .tag-unknown { margin-left: auto; font-size: 10px; color: var(--tx2); border: 1px solid var(--bdr); border-radius: 4px; padding: 0 5px; line-height: 15px; }
    .badge-joined { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--grn); }

    /* ── Active event banner（マイクエスト (イベント) セクション直前に表示） ── */
    .active-events {
      display: flex; flex-direction: column; gap: 4px;
      padding: 6px 8px;
      margin: 4px 6px 8px;
      border: 1px solid var(--bdr);
      border-left: 3px solid var(--cat-event);
      border-radius: var(--r-sm);
      background: var(--bg1);
    }
    .active-event-row {
      display: flex; align-items: baseline; gap: 8px;
      justify-content: space-between;
    }
    .active-event-name {
      color: var(--cat-event);
      text-decoration: none;
      font-weight: 600;
      flex: 1 1 auto;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .active-event-name:hover { text-decoration: underline; }
    /* 予告から昇格・本開催URL未確定のためクリック不可 */
    .active-event-name-disabled {
      color: var(--tx2);
      font-weight: 600;
      flex: 1 1 auto;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: not-allowed;
      opacity: .7;
    }
    .active-event-del {
      background: none; border: none; color: var(--tx2);
      cursor: pointer; font-size: 13px; padding: 0 1px;
      flex: 0 0 auto; line-height: 1;
    }
    .active-event-del:hover { color: var(--red); }
    .active-event-period {
      color: var(--tx1);
      font-size: 11px;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    /* イベントグループ（開催予告 / 開催中 / 開催終了） */
    .event-group { display: flex; flex-direction: column; gap: 3px; }
    .event-group + .event-group { margin-top: 6px; }
    .event-group-label {
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 10px;
      letter-spacing: .04em;
      line-height: 1.4;
    }
    .event-group-teaser .event-group-label { background: var(--grn); color: var(--bg0); }
    .event-group-active .event-group-label { background: var(--tx0); color: var(--bg0); }
    .event-group-ended  .event-group-label { background: #e8c547;    color: var(--bg0); }
    .event-group-rows { display: flex; flex-direction: column; gap: 4px; }
    .event-group-teaser .active-event-name,
    .event-group-active .active-event-name  { color: var(--tx0); }
    .event-group-ended .active-event-name   { color: var(--tx2); }
    .event-group-ended .active-event-period { color: var(--tx2); }

    /* ── イベントバナー（mypage グローバルバナー由来）── */
    .event-group-banners { display: flex; flex-direction: column; gap: 6px; }
    .event-banner {
      position: relative;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      line-height: 0;
      background: var(--bg1, #1a1a1a);
    }
    .event-banner-img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* 開催期間: バナー左上基点・白縁黒字 */
    .event-banner-period {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #000;
      line-height: 1.2;
      padding: 0 2px;
      letter-spacing: .02em;
      pointer-events: none;
      text-shadow:
        -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,
         0   -1px 0 #fff, 0    1px 0 #fff, -1px 0   0 #fff, 1px 0   0 #fff;
    }
    .event-banner-del {
      position: absolute;
      top: 2px; right: 2px;
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.5); border: none; border-radius: 50%;
      color: #fff; cursor: pointer; font-size: 11px; line-height: 1;
      padding: 0;
    }
    .event-banner-del:hover { background: var(--red); }
    /* 開催終了: グレーアウト */
    .event-group-ended .event-banner-img { filter: grayscale(1); opacity: .55; }

    /* ── Host history tile grid ── */
    .host-groups { display: flex; flex-direction: column; gap: 2px; }
    .host-group-header {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px 2px;
      margin-top: 2px;
    }
    .host-group-label {
      font-size: 11px; font-weight: 700; color: var(--tx0);
      white-space: nowrap; letter-spacing: 0.5px;
    }
    .host-group-line {
      flex: 1; height: 2px; background: var(--bdr2); border-radius: 1px;
    }
    .host-group-header.host-cat-nm    .host-group-line { background: var(--cat-nm); }
    .host-group-header.host-cat-hl    .host-group-line { background: var(--cat-hl); }
    .host-group-header.host-cat-ul    .host-group-line { background: var(--cat-ul); }
    .host-group-header.host-cat-free  .host-group-line { background: var(--cat-free); }
    .host-group-header.host-cat-event .host-group-line { background: var(--cat-event); }
    .host-group-header.host-cat-pro   .host-group-line { background: var(--cat-pro); }
    .host-group-header.host-cat-etc   .host-group-line { background: var(--cat-etc); }
    .host-grid {
      display: grid; grid-template-columns: repeat(var(--host-cols, 3), 1fr); gap: 6px;
      padding: 6px;
    }
    .host-tile {
      position: relative;
      border-radius: var(--r); overflow: hidden;
      background: var(--bg2); border: 1px solid var(--bdr);
      cursor: pointer; transition: border-color .15s, background .1s;
      user-select: none;
    }
    .host-tile:hover { border-color: var(--acc); background: var(--hov); }
    .host-tile:active { background: var(--act); }
    /* タイル全面を覆う透明ボタン。キーボード到達とフォーカスリングを成立させる */
    .host-tile-open {
      position: absolute; inset: 0; z-index: 0;
      background: none; border: none; padding: 0; margin: 0;
      font: inherit; color: transparent; cursor: pointer;
    }
    .host-tile-open:focus-visible { outline: none; }
    .host-tile.depleted .host-tile-open { display: none; }
    .host-tile:has(.host-tile-open:focus-visible) { outline: 2px solid var(--acc); outline-offset: 2px; }
    .host-tile .thumb, .host-tile .thumb-placeholder, .host-tile-info { position: relative; z-index: 1; }
    .host-tile.depleted {
      opacity: 0.45;
      background: rgba(255,255,255,0.03);
      cursor: not-allowed;
    }
    .host-tile.host-cat-free   { border-left: 3px solid var(--cat-free); }
    .host-tile.host-cat-nm     { border-left: 3px solid var(--cat-nm); }
    .host-tile.host-cat-hl     { border-left: 3px solid var(--cat-hl); }
    .host-tile.host-cat-ul     { border-left: 3px solid var(--cat-ul); }
    .host-tile.host-cat-event  { border-left: 3px solid var(--cat-event); }
    .host-tile.host-cat-pro    { border-left: 3px solid var(--cat-pro); }
    .host-tile.host-cat-etc    { border-left: 3px solid var(--cat-etc); }
    .host-tile .thumb {
      width: 100%; height: auto; aspect-ratio: 4/3;
      object-fit: contain; display: block; border-radius: 0;
      padding: 2px; box-sizing: border-box;
    }
    .host-tile .thumb-placeholder {
      width: 100%; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg3); color: var(--tx2); font-size: 22px;
    }
    .host-tile-info {
      padding: 4px 5px 5px; pointer-events: none;
    }
    .host-tile-name {
      font-size: 10px; font-weight: 600; color: var(--tx0);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px; line-height: 1.3;
    }
    .host-tile-meta {
      font-size: 10px; color: var(--tx1); line-height: 1.3;
    }
    .host-count-badge {
      display: inline-flex; align-items: center; gap: 1px;
      font-size: 10px; font-weight: 700;
    }
    .host-count-badge .hc-current { color: var(--acc); }
    .host-count-badge .hc-sep { color: var(--tx2); }
    .host-count-badge .hc-max { color: var(--tx2); }
    .host-count-badge.depleted .hc-current { color: var(--red); }
    /* 本日上限解除中: 残り回数ではなく本日の実自発回数を表示していることを示す */
    .host-count-badge.override .hc-badge-mark { font-size: 10px; font-weight: 400; color: var(--tx2); margin-right: 2px; }
    .host-count-badge.override .hc-current { color: var(--cat-event, var(--acc)); }
    .host-tile-time { font-size: 10px; color: var(--tx2); }
    /* hell skip 回数プルダウン (.host-tile-info は pointer-events:none なので auto で受け直す) */
    .hell-skip-select {
      pointer-events: auto;
      background: var(--bg1); color: var(--tx0);
      border: 1px solid var(--bdr2); border-radius: 3px;
      font-size: 10px; padding: 0 2px;
      margin-left: 4px; cursor: pointer;
      vertical-align: middle;
    }
    .hell-skip-select:hover { border-color: var(--acc); }

    /* ── Host history delete buttons ── */
    /* 全削除は破壊的操作なので右端に離して配置し、hover を赤にする */
    .host-clear-all { margin-left: auto; }
    .host-clear-all:hover { color: var(--red); border-color: var(--red); }
    .host-del {
      position: absolute; top: 2px; right: 2px;
      background: rgba(26,30,36,0.75); border: none; border-radius: var(--r-sm);
      color: var(--tx2); font-size: 12px; line-height: 1;
      cursor: pointer; padding: 2px 4px;
      opacity: 0; transition: opacity .15s ease-out, color .15s ease-out;
      pointer-events: auto; z-index: 2;
    }
    .host-tile:hover .host-del { opacity: 1; }
    .host-del:hover { color: var(--red); }

    /* ── States ── */
    .state { padding: 24px 16px; text-align: center; color: var(--tx2); }
    .state .ico { font-size: 26px; margin-bottom: 7px; }
    .state p { font-size: 12px; line-height: 1.7; }
    .loading-state { padding: 20px; text-align: center; color: var(--tx2); font-size: 12px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--bdr); border-top-color: var(--acc); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 8px; }
    .err { padding: 14px 10px; color: var(--red-tx); font-size: 12px; text-align: center; line-height: 1.7; }

    /* ── Template name input ── */
    .tpl-name-row { display: none; align-items: center; gap: 5px; padding: 5px 10px; background: var(--bg0); border-bottom: 1px solid var(--acc); flex-shrink: 0; }
    .tpl-name-row.open { display: flex; }
    .tpl-name-input { flex: 1; background: var(--bg2); border: 1px solid var(--acc); color: var(--tx0); border-radius: var(--r-sm); padding: 5px 8px; font-size: 12px; }
    .tpl-name-input:focus { outline: none; }
    .btn-tpl-save { background: var(--acc); border: none; color: var(--bg0); border-radius: var(--r-sm); padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .btn-tpl-save:hover { background: var(--acc-d); }
    .btn-tpl-cancel { background: var(--bg2); border: 1px solid var(--bdr2); color: var(--tx1); border-radius: var(--r-sm); padding: 5px 8px; font-size: 12px; cursor: pointer; flex-shrink: 0; }

    /* ── Info button ── */
    .info-btn {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid transparent; border-radius: 50%;
      background: none; color: var(--tx2);
      font-size: 14px; line-height: 1; cursor: pointer;
      transition: color .12s, background .12s, border-color .12s;
    }
    .info-btn:hover { color: var(--acc); background: rgba(87,207,220,0.1); }
    .info-btn.active { color: var(--acc); border-color: var(--acc-d); background: rgba(87,207,220,0.14); }

    /* ── Help panel ── */
    .help-panel {
      display: none;
      background: var(--bg0);
      border-bottom: 2px solid var(--acc);
      padding: 10px 12px;
      flex-shrink: 0;
      max-height: 60vh;
      overflow-y: auto;
    }
    .help-panel.open { display: block; }
    .help-title { font-size: 11px; color: var(--acc); letter-spacing: .06em; margin-bottom: 8px; font-weight: 600; }
    .help-list { font-size: 11px; line-height: 1.55; color: var(--tx1); }
    .help-list dt { color: var(--tx0); font-weight: 600; margin-top: 6px; }
    .help-list dt:first-child { margin-top: 0; }
    .help-list dd { margin: 1px 0 0 0; padding-left: 8px; color: var(--tx1); border-left: 2px solid var(--bdr); }

    /* ── Info page (情報タブ本体) ── */
    .info-page {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 12px 14px 16px;
      background: var(--bg0);
    }
    .info-page::-webkit-scrollbar { width: 4px; }
    .info-page::-webkit-scrollbar-track { background: var(--bg0); }
    .info-page::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px; }
    .info-section { margin-bottom: 16px; }
    .info-section:last-child { margin-bottom: 0; }
    .info-section-title {
      font-size: 12px; color: var(--acc); letter-spacing: .04em;
      margin-bottom: 8px; font-weight: 700;
      border-bottom: 1px solid var(--bdr); padding-bottom: 4px;
    }
    .info-page .help-list dd strong { color: var(--tx0); font-weight: 700; }
    .info-page .help-list dd em {
      font-style: normal; color: var(--org); font-weight: 600;
    }

    /* ── 展開アイテム（使い方・FAQ 共通） ── */
    .collapsible-list { border: 1px solid var(--bdr); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 0; }
    .collapsible-item { border-bottom: 1px solid var(--bdr); }
    .collapsible-item:last-child { border-bottom: none; }
    .collapsible-item summary {
      list-style: none; cursor: pointer;
      padding: 7px 10px; display: flex; align-items: center; gap: 7px;
      color: var(--tx0); font-weight: 600; font-size: 11px;
      user-select: none; background: var(--bg1);
    }
    .collapsible-item summary::-webkit-details-marker { display: none; }
    .collapsible-item summary::before {
      content: '▶'; font-size: 10px; color: var(--tx2); flex-shrink: 0;
      transition: transform .15s;
    }
    .collapsible-item[open] summary::before { transform: rotate(90deg); }
    .collapsible-item .item-body {
      padding: 6px 10px 8px 26px;
      color: var(--tx1); font-size: 11px; line-height: 1.55;
    }
    .collapsible-item .item-body strong { color: var(--tx0); font-weight: 700; }
    .collapsible-item .item-body em { font-style: normal; color: var(--org); font-weight: 600; }

    /* ── Info 常設フッター ── */
    .info-static-footer {
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--bdr);
      display: flex; flex-direction: column; gap: 7px;
    }
    .info-support-text {
      font-size: 11px; color: var(--tx1); text-align: center;
      margin: 0 0 2px;
    }
    .info-link-row { display: flex; gap: 7px; }
    .info-link-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 6px 8px; border-radius: var(--r-sm);
      background: var(--bg2); border: 1px solid var(--bdr);
      color: var(--tx0); font-size: 11px; text-decoration: none;
      transition: background .15s;
    }
    .info-link-btn:hover { background: var(--bg3); }
    .info-link-btn svg { flex-shrink: 0; }
    .bmc-btn { color: #f9a825; border-color: #f9a825; }
    .afdian-btn { color: var(--acc); border-color: var(--acc); }
    .info-version-display {
      text-align: center; font-size: 10px;
      color: var(--tx2); letter-spacing: .04em;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
